name: Apply direct mobile UI fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-direct-mobile-ui-fix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Remove the standalone Trend tab button.
          s = re.sub(r'\n\s*<button class="tab-btn" data-tab="tabTrend">推移</button>', '', s, count=1)

          # 2) Give dashboard sections stable IDs.
          s = s.replace(
              '  <!-- IPS準拠チェック -->\n  <section class="panel">',
              '  <!-- IPS準拠チェック -->\n  <section class="panel" id="dashboardIPS">',
              1
          )
          s = s.replace(
              '  <!-- 資産分類 -->\n  <section class="panel">',
              '  <!-- 資産分類 -->\n  <section class="panel" id="dashboardPie">',
              1
          )

          # 3) Move the Trend section itself into the dashboard, below the pie chart.
          if 'id="dashboardTrend"' not in s:
              m = re.search(
                  r'\n<div id="tabTrend" class="tab-pane">\s*<!-- 日別推移 -->\s*(<section class="panel wide">.*?</section>)\s*</div><!-- /tabTrend -->',
                  s,
                  flags=re.S,
              )
              if not m:
                  raise SystemExit('Could not locate tabTrend block')
              trend = m.group(1).replace(
                  '<section class="panel wide">',
                  '<section class="panel wide" id="dashboardTrend">',
                  1,
              )
              s = s[:m.start()] + '\n' + s[m.end():]
              marker = '\n</div><!-- /tabDash -->'
              if marker not in s:
                  raise SystemExit('Could not locate tabDash closing marker')
              s = s.replace(
                  marker,
                  '\n  <!-- 日別推移（ダッシュボード統合） -->\n' + trend + marker,
                  1,
              )

          # 4) Explain the unrealized P/L formula in the card itself.
          if 'id="pnlLogicNote"' not in s:
              target = '      <div class="sub" id="pnlCostLine" style="margin-top:2px;">—</div>'
              note = target + '\n      <div class="sub" id="pnlLogicNote" style="margin-top:8px;font-size:10px;line-height:1.5">計算: 各銘柄の「評価額 −（保有数量 × 取得単価）」を合算。損益率 = 総含み損益 ÷ 取得総額。Quantity / CostBasis がある銘柄のみ対象。</div>'
              if target not in s:
                  raise SystemExit('Could not locate pnlCostLine')
              s = s.replace(target, note, 1)

          # 5) Dashboard renderer must also draw the moved line chart.
          s = re.sub(
              r'tabDash:\s*\(\) => \{ refreshKPIs\(\); renderReturns\(\); renderIPS\(\); drawPie\(\);(?: drawLine\(\);)? \},',
              'tabDash:  () => { refreshKPIs(); renderReturns(); renderIPS(); drawPie(); drawLine(); },',
              s,
              count=1,
          )
          s = re.sub(r'\n\s*tabTrend:\s*\(\) => \{ drawLine\(\); \},', '', s, count=1)

          # 6) Direct mobile CSS: fixed bottom nav + reliable iOS file input + dashboard ordering.
          if '/* === direct mobile layout v6 === */' not in s:
              css = r'''

    /* === direct mobile layout v6 === */
    @media (max-width:600px){
      body{padding-bottom:calc(76px + env(safe-area-inset-bottom))!important}

      /* Bottom navigation: genuinely fixed to the bottom, removed from header flow. */
      #tabNav{
        position:fixed!important;
        left:0!important;right:0!important;bottom:0!important;top:auto!important;
        z-index:300!important;
        width:100%!important;
        display:grid!important;
        grid-template-columns:repeat(4,minmax(0,1fr))!important;
        gap:4px!important;
        margin:0!important;
        padding:7px 6px calc(7px + env(safe-area-inset-bottom))!important;
        overflow:visible!important;
        background:rgba(17,17,17,.97)!important;
        border-top:1px solid var(--line)!important;
        border-bottom:0!important;
        backdrop-filter:saturate(130%) blur(12px);
        -webkit-backdrop-filter:saturate(130%) blur(12px);
      }
      #tabNav .tab-btn{
        min-width:0!important;
        width:100%!important;
        flex:none!important;
        padding:10px 2px!important;
        border-radius:10px!important;
        font-size:11px!important;
        line-height:1.2!important;
        white-space:nowrap!important;
        overflow:hidden!important;
        text-overflow:ellipsis!important;
      }

      /* iOS/Safari file input: prevent vertical clipping. */
      header{overflow:visible!important}
      .toolbar{overflow:visible!important;align-items:stretch!important}
      input[type="file"]{
        display:block!important;
        width:100%!important;
        min-height:48px!important;
        height:48px!important;
        padding:6px!important;
        margin:0!important;
        font-size:14px!important;
        line-height:normal!important;
        overflow:visible!important;
        box-sizing:border-box!important;
        -webkit-appearance:none;
        appearance:none;
      }
      input[type="file"]::file-selector-button,
      input[type="file"]::-webkit-file-upload-button{
        min-height:34px!important;
        height:34px!important;
        margin:0 8px 0 0!important;
        padding:6px 12px!important;
        line-height:20px!important;
        vertical-align:middle!important;
        border:0!important;
        border-radius:9px!important;
      }

      /* Dashboard order: total -> pie -> trend -> P/L -> return -> IPS. */
      #tabDash.active > .kpi{display:contents!important}
      #tabDash.active > .kpi > .card:first-child{order:1!important}
      #dashboardPie{order:2!important}
      #dashboardTrend{order:3!important}
      #kpiPnlCard{order:4!important}
      #kpiRetCard{order:5!important}
      #dashboardIPS{order:6!important}
    }
'''
              marker = '    /* 390px以下（iPhone SE等） */'
              if marker in s:
                  s = s.replace(marker, css + '\n' + marker, 1)
              else:
                  s = s.replace('</style>', css + '\n  </style>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit direct UI fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: move mobile nav to bottom and integrate trend into dashboard"
          git push
