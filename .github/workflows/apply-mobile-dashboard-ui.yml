name: Apply requested mobile dashboard UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-dashboard-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          marker = '/* ===== Mobile bottom navigation + dashboard composition ===== */'
          if marker not in text:
              css = r'''

    /* ===== Mobile bottom navigation + dashboard composition ===== */
    @media (max-width:600px){
      body{
        padding-bottom:calc(68px + env(safe-area-inset-bottom));
      }

      /* アプリ風の下部固定タブ */
      #tabNav{
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        z-index:180;
        display:grid;
        grid-template-columns:repeat(5,minmax(0,1fr));
        gap:4px;
        margin:0;
        padding:7px 6px calc(7px + env(safe-area-inset-bottom));
        overflow:visible;
        background:rgba(17,17,17,.96);
        border-top:1px solid var(--line);
        backdrop-filter:saturate(130%) blur(12px);
        -webkit-backdrop-filter:saturate(130%) blur(12px);
      }
      #tabNav .tab-btn{
        min-width:0;
        width:100%;
        padding:8px 2px;
        border-radius:9px;
        font-size:10px;
        line-height:1.2;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
      }

      /* ダッシュボードでは「評価総額 → 円グラフ → 推移 → IPS」の順に表示 */
      #tabDash.active ~ #tabTrend{display:contents;}
      #tabDash.active > .kpi{order:1;}
      #tabDash.active > section:nth-of-type(3){order:2;}
      #tabDash.active ~ #tabTrend > section{order:3;}
      #tabDash.active > section:nth-of-type(2){order:4;}
    }
'''
              needle = '  </style>'
              if needle not in text:
                  raise SystemExit('style closing tag not found')
              text = text.replace(needle, css + '\n' + needle, 1)

          old = "  tabDash:  () => { refreshKPIs(); renderReturns(); renderIPS(); drawPie(); },"
          new = "  tabDash:  () => { refreshKPIs(); renderReturns(); renderIPS(); drawPie(); if(window.matchMedia('(max-width:600px)').matches) drawLine(); },"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('tabDash renderer pattern not found')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit UI update and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mobile-dashboard-ui.yml
          git add index.html
          git commit -m "feat: mobile bottom tabs and dashboard trend"
          git push origin HEAD:main
